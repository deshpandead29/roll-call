/* Layout: a group-chat scrapbook. Dotted notebook page, white cards held with washi tape, die-cut stickers for state, hand-drawn marks (rough.js) for emphasis. Type leads; the hand only annotates. Phone-first single column. */
:root{
  --paper:#FAF7F1; --dot:#DCD4C5; --card:#FFFFFF; --ink:#16151A; --muted:#615C67; --line:#E7E1D5;
  --pink:#FF4F9A; --blue:#3A57FF; --lime:#C6EE36; --orange:#FF7A1F; --on-blue:#FFFFFF; --die:#FFFFFF; --print:#FBF8F2;
  --tape-pink:rgba(255,79,154,.5); --tape-blue:rgba(58,87,255,.38); --tape-lime:rgba(198,238,54,.7);
  --shadow:rgba(40,28,14,.18);
  --display:"Bricolage Grotesque","Arial Narrow",system-ui,sans-serif;
  --body:"Instrument Sans",ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
  --hand:"Excalifont","Segoe Print","Bradley Hand","Comic Sans MS",cursive;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --paper:#131217; --dot:#2B2931; --card:#1D1B22; --ink:#F3F0EA; --muted:#A8A3AF; --line:#2F2C36;
  --pink:#FF67AA; --blue:#7B90FF; --lime:#D2F45A; --orange:#FF8D3B; --on-blue:#0F0E13; --die:#F3F0EA; --print:#F4F0E8;
  --tape-pink:rgba(255,103,170,.55); --tape-blue:rgba(123,144,255,.5); --tape-lime:rgba(210,244,90,.6);
  --shadow:rgba(0,0,0,.55); color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#131217; --dot:#2B2931; --card:#1D1B22; --ink:#F3F0EA; --muted:#A8A3AF; --line:#2F2C36;
  --pink:#FF67AA; --blue:#7B90FF; --lime:#D2F45A; --orange:#FF8D3B; --on-blue:#0F0E13; --die:#F3F0EA; --print:#F4F0E8;
  --tape-pink:rgba(255,103,170,.55); --tape-blue:rgba(123,144,255,.5); --tape-lime:rgba(210,244,90,.6);
  --shadow:rgba(0,0,0,.55); color-scheme:dark}
*{box-sizing:border-box}
body{background-color:var(--paper);background-image:radial-gradient(var(--dot) 1.1px,transparent 1.5px);background-size:22px 22px;
  color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.5;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:22px 80px}
.wrap{max-width:560px;margin:0 auto;display:flex;flex-direction:column;gap:34px}
h1,h2,h3{font-family:var(--display);margin:0;text-wrap:balance;font-variation-settings:"wdth" 78}
h1{font-size:clamp(3.1rem,14vw,5.4rem);font-weight:800;line-height:.86;letter-spacing:-.025em}
h2{font-size:1.9rem;font-weight:800;line-height:.95;letter-spacing:-.015em}
p{margin:0}
.muted{color:var(--muted)}
.small{font-size:.92rem}
.label{font-size:.72rem;font-weight:700;text-transform:uppercase;letter-spacing:.11em;color:var(--muted)}

function budget(ev){
  const T=TYPES[ev.type],reserved=T.honoree&&ev.honoree?1:0;

}

  const open=pace==="chill"?Math.max(1,T.open-1):T.open;

function rollState(ev,who){
  const b=budget(ev),cs=C(),t=now(),last=cs.length?cs[cs.length-1].at:0;
  const usedOpen=cs.filter(c=>!c.reserved&&!c.extra).length,reservedUsed=cs.some(c=>c.reserved);
  const remaining=b.open===Infinity?Infinity:Math.max(0,b.open-usedOpen);
  const cooldownLeft=last?Math.max(0,last+b.cooldown*60000-t):0;
  const grant=asks.find(a=>a.requester===who&&!a.used&&backers(a.id).length>=2&&t-a.at<30*60000);
  const mine=cs.filter(c=>c.caller===who&&!c.extra&&(ev.type!=="trip"||c.day===todayStr()));
  const r={b,remaining,reservedUsed,cooldownLeft,ok:false,why:"",canAsk:false,reserved:false,extra:false,askId:null};
  if(!isLive(ev)){r.why=isRevealed(ev)?"Revealed.":"Opens when it starts.";return r}
  if(cooldownLeft>0){r.why=`Next one in ${mins(cooldownLeft)} min`;return r}
  if(grant){Object.assign(r,{ok:true,extra:true,askId:grant.id});return r}
  if(ev.pace!=="chaos"&&mine.length){r.why=ev.type==="trip"?"You've used yours today":"You've used yours";r.canAsk=true;return r}
  if(who===ev.honoree&&b.reserved&&!reservedUsed){Object.assign(r,{ok:true,reserved:true});return r}
  if(remaining>0){r.ok=true;return r}
  r.why="None left";r.canAsk=true;return r;
}
const backers=askId=>backs.filter(b=>b.askId===askId).map(b=>b.member);
function nudgeFor(ev,who,rs){
  const t=now(),h=new Date(t).getHours(),cs=C();
  const recent=cs.filter(c=>c.at>t-2*3600000);
  const others=ev.members.filter(m=>m!==who);
  const out=others.filter(m=>!isHome(m)&&!isSnoozed(m));
  const res={copy:"",yes:"Shoot",no:"Cancel",split:null};
  if(others.length>=2&&out.length<others.length&&out.length>0&&(others.length-out.length)>=others.length/2)res.split=out;
  if(h>=0&&h<6){res.copy=`It's ${hhmm(t)}. People are asleep.`;res.yes="Call anyway";res.no="Save it"}
  else if(recent.length>=3){res.copy=`${recent.length} calls since ${hhmm(recent[0].at)}. Sure?`;res.yes="Call anyway";res.no="Wait"}
  else if(!rs.extra&&!rs.reserved&&rs.remaining===1){
    if(ev.type==="birthday"){res.copy="Last one. Is it the cake?";res.yes="It's the cake";res.no="Save it"}
    else{res.copy="Last one. Sure?";res.yes="Yes, now";res.no="Save it"}}
  else if(res.split){res.copy=`Only ${res.split.length+1} of you still out.`}
  return res;
}

}

async function loadImgs(list){

      ${mission("group",`<span class="dot-ic lg" style="background:var(--blue);color:var(--on-blue)" aria-hidden="true">all</span>`,"Everyone",groupFrame(ev,di),"")}
      ${mission("hunt",h.type==="colour"?`<span class="dot-ic lg" style="background:${h.bg}" aria-hidden="true"></span>`:`<span class="dot-ic lg" style="background:var(--orange);--r:5deg" aria-hidden="true">${esc(h.glyph)}</span>`,"Hunt",h.text,h.sub)}
      ${mission("wild",`<span class="dot-ic lg" style="background:var(--pink);--r:-3deg" aria-hidden="true">${CAT_GLYPH[w.cat]}</span>`,`Wildcard · ${CAT_LABEL[w.cat]}`,w.text,"",!wildShot&&sw<1?`<button class="ghost" data-swap="wild" ${dis}>Swap</button>`:"")}`;
  }else{
    const sw=swapCount(ev,m,day),task=single(ev,i,sw),shot=mine.some(p=>p.kind==="night");
    ch=mission("night",`<span class="dot-ic lg" style="background:var(--orange)" aria-hidden="true">!</span>`,"Your challenge",task,"",!shot&&sw<1?`<button class="ghost" data-swap="night" ${dis}>Swap</button>`:"");
  }
  let rc="";
  if(isRecreateDay(ev,di)){
    const dir=director(ev,di),present=ev.members.filter(x=>!isHome(x)).length||ev.members.length;
    const count=Math.min(S.rcCount||present,14),done=P().find(p=>p.kind==="recreate"&&p.day===day);
    if(dir===m){
      const r=recreateFor(ev,di,count,S.rcOffset);
      rc=`<div class="mission recreate"><span class="dot-ic lg" style="background:#7A4FD0;color:#fff" aria-hidden="true">art</span><div class="body">
        <span class="label">You're directing</span>
        ${r?`<p class="task">${esc(r.title)}</p>${r.img?`<img class="orig" src="art/${r.img}.jpg" alt="${esc(r.title)}, ${esc(r.source)}">`:""}
        <p class="small">${esc(r.prompt)}</p><p class="muted small">${esc(r.format)} · ${esc(r.source)}, ${esc(r.year)}${r.img?"":" · from memory"}</p>`:`<p class="muted">Nothing for that many yet.</p>`}
        <div class="field"><span class="label">People</span><div class="chips">${[1,2,3,4,5,6,8,10].filter(n=>n<=Math.max(ev.members.length,1)).map(n=>`<button type="button" class="chip" data-rcn="${n}" aria-pressed="${count===n}">${n}</button>`).join("")}</div></div>
        ${negs(P().filter(p=>p.kind==="recreate"&&p.day===day&&p.member===m))}
        <div class="row"><button class="shutter" data-shoot="recreate" ${r?dis:"disabled"}>Shoot</button><button class="ghost" id="rcNext">Another</button></div></div></div>`;
    }else rc=`<div class="mission recreate"><span class="dot-ic lg" style="background:#7A4FD0;color:#fff" aria-hidden="true">art</span><div class="body"><span class="label">Recreate</span><p class="task">${esc(dir)}'s directing</p><p class="muted small">${done?"Done. See it at the reveal.":"If they grab you, go with it."}</p></div></div>`;
  }
  const all=P(),counts=Object.fromEntries(ev.members.map(x=>[x,all.filter(p=>p.member===x).length]));
  const delP=S.confirmDelete?all.find(p=>p.id===S.confirmDelete):null;
  const rv=ev.type==="trip"?fmt(addDays(ev.end,1)):`${fmt(addDays(ev.end,1))}, 11am`;
  app.innerHTML=header(ev)+rollCard(ev,m)+`
  <section class="card">
    <h2>Your challenge${ev.type==="trip"?"s":""}</h2>
    ${ch}${rc}
    ${delP?`<div class="confirm"><p>Delete this shot?</p><div class="row"><button id="delYes" class="danger">Delete</button><button class="ghost" id="delNo">Keep</button></div></div>`:""}
  </section>
  <section class="card counter t-lime">
    <div class="top"><h2>Shots</h2><span class="big">${all.length}</span></div>
    <p class="muted small">Who's shooting, not what.</p>
    ${ev.members.map(x=>`<div class="who"><span>${esc(x)}${x===m?" (you)":""}</span><span class="tally">${tally(Math.min(counts[x],60),hash(x))}</span><span class="num">${counts[x]}</span></div>`).join("")}
  </section>
  <section class="card t-blue">
    <div class="top"><h2>Reveal</h2><span class="hand ink">${rv}</span></div>
    ${S.confirmReveal?`<div class="confirm"><p>Reveal for everyone? Shooting ends.</p><div class="row"><button id="revealYes">Reveal</button><button class="ghost" id="revealNo">Cancel</button></div></div>`
      :`<button class="ghost" id="revealAsk" ${dis}>Reveal now</button>`}
  </section>`;
  bindEvent(ev,m,day,di);
}
function bindEvent(ev,m,day,di){
  const app=$("#app");
  $("#back").onclick=()=>go("group",{groupId:S.groupId});
  app.querySelectorAll("[data-day]").forEach(b=>b.onclick=()=>{S.day=b.dataset.day;S.rcCount=null;S.rcOffset=0;render()});
  app.querySelectorAll("[data-shoot]").forEach(b=>b.onclick=()=>shoot({kind:b.dataset.shoot,ev,m,day,di}));
  app.querySelectorAll("[data-swap]").forEach(b=>b.onclick=()=>swapIt(ev,m,day));
  app.querySelectorAll("[data-del]").forEach(b=>b.onclick=()=>{S.confirmDelete=b.dataset.del;render()});
  app.querySelectorAll("[data-rcn]").forEach(b=>b.onclick=()=>{S.rcCount=+b.dataset.rcn;S.rcOffset=0;render()});
  const nx=$("#rcNext");if(nx)nx.onclick=()=>{S.rcOffset++;render()};
  app.querySelectorAll("[data-st]").forEach(b=>b.onclick=()=>setStatus(ev,m,b.dataset.st));
  app.querySelectorAll("[data-back]").forEach(b=>b.onclick=()=>backAsk(ev,m,b.dataset.back));
  app.querySelectorAll("[data-answer]").forEach(b=>b.onclick=()=>answer(ev,m,b.dataset.answer));
  app.querySelectorAll("[data-mode]").forEach(b=>b.onclick=()=>{S.sheet.mode=b.dataset.mode;render()});
  const cb=$("#callBtn");if(cb)cb.onclick=()=>{const rs=rollState(ev,m);if(!rs.ok)return toast(rs.why);const n=nudgeFor(ev,m,rs);S.sheet={type:"call",nudge:n,split:n.split,mode:n.split?"split":"all"};render()};
  const go1=$("#callGo");if(go1)go1.onclick=()=>{const rs=rollState(ev,m);if(!rs.ok){S.sheet=null;render();return toast(rs.why)}
    const others=ev.members.filter(x=>x!==m),rec=S.sheet.split&&S.sheet.mode==="split"?S.sheet.split:others;
    shoot({kind:"call",ev,m,day,di,recipients:rec,reserved:rs.reserved,extra:rs.extra,askId:rs.askId})};
  const no1=$("#callNo");if(no1)no1.onclick=()=>{S.sheet=null;render()};
  const ask=$("#askBtn");if(ask)ask.onclick=()=>askMore(ev,m);
  const dp=S.confirmDelete;if(dp){$("#delNo").onclick=()=>{S.confirmDelete=null;render()};$("#delYes").onclick=()=>deletePhoto(dp)}
  if(S.confirmReveal){$("#revealNo").onclick=()=>{S.confirmReveal=false;render()};$("#revealYes").onclick=()=>revealNow(ev)}
  else{const ra=$("#revealAsk");if(ra)ra.onclick=()=>{S.confirmReveal=true;render()}}
}

/* actions */
async function setStatus(ev,m,what){
  const t=now(),d=new Date(t),six=new Date(d.getFullYear(),d.getMonth(),d.getDate()+(d.getHours()>=6?1:0),6).getTime();
  const patch=what==="1h"?{snoozeUntil:t+3600000}:what==="night"?{snoozeUntil:six}:what==="wake"?{snoozeUntil:0}:what==="home"?{home:true,homeAt:t}:{home:false};
  const{id:_i,...cur}=statusOf(m);
  try{await db.doc(`status/${ev.id}~${hid(m)}`).set({...cur,...patch,eventId:ev.id,member:m});
    toast({"1h":"Snoozed 1 hour","night":"Snoozed till morning","home":"Get home safe","out":"Welcome back","wake":"Unsnoozed"}[what])}
  catch(x){toast(writeErr(x))}
}
async function askMore(ev,m){try{await db.collection("asks").doc().set({eventId:ev.id,requester:m,at:now(),used:false});toast("Asked. Needs 2 backers.")}catch(x){toast(writeErr(x))}}
async function backAsk(ev,m,askId){try{await db.doc(`backs/${askId}~${hid(m)}`).set({eventId:ev.id,askId,member:m,at:now()});toast("Backed")}catch(x){toast(writeErr(x))}}
async function swapIt(ev,m,day){try{await db.doc(`swaps/${ev.id}~${hid(m)}~${day}`).set({eventId:ev.id,member:m,day,n:1});toast("Swapped")}catch(x){toast(writeErr(x))}}
function answer(ev,m,callId){const c=C().find(x=>x.id===callId);if(!c)return;shoot({kind:"answer",ev,m,day:c.day||ev.start,di:evDays(ev).indexOf(c.day),call:c})}

let pending=null;
function shoot(job){
  if(S.busy||!db)return;pending=job;
  const inp=$("#camera");inp.value="";inp.click();
}
$("#camera").addEventListener("change",async e=>{
  const f=e.target.files&&e.target.files[0];if(!f||!pending)return;
  const job=pending;pending=null;S.busy=true;toast("Printing…");
  const{ev,m,day,di}=job,i=ev.members.indexOf(m);
  try{
    const url=URL.createObjectURL(f);
    let img;try{img=await loadImage(url)}finally{setTimeout(()=>URL.revokeObjectURL(url),1000)}
    const frame=P().filter(p=>p.member===m).length+1,t=now();
    let kind=job.kind,meta={},mission="";
    if(kind==="call"||kind==="answer"){
      const callId=kind==="call"?db.collection("calls").doc().id:job.call.id,caller=kind==="call"?m:job.call.caller;
      mission=`roll call · ${caller}`;meta={rollId:callId,late:kind==="answer"&&t-job.call.at>120000};kind="roll";job.callId=callId;
    }else if(kind==="group")mission=groupFrame(ev,di);
    else if(kind==="hunt"){const h=hunt(ev,di,i);mission=h.text;meta={tag:h.tag,huntType:h.type,order:h.order}}
    else if(kind==="wild"){const w=wild(ev,di,i,swapCount(ev,m,day));mission=w.text;meta={cat:w.cat}}
    else if(kind==="night")mission=single(ev,i,swapCount(ev,m,day));
    else if(kind==="recreate"){const present=ev.members.filter(x=>!isHome(x)).length||ev.members.length,cnt=Math.min(S.rcCount||present,14),r=recreateFor(ev,di,cnt,S.rcOffset);mission=r.title;meta={recreateId:r.id,starring:cnt}}
    const data=jpeg(await develop(img,{W:1080,frame,who:m,date:handDate(todayStr()),time:kind==="roll"?hhmm(t):"",mission,accent:ACCENT[kind],seed:t%100000}));
    const ref=db.collection("photos").doc();
    await db.doc("imgs/"+ref.id).set({data,eventId:ev.id});imgCache.set(ref.id,data);
    await ref.set({eventId:ev.id,member:m,day,kind,at:t,frame,mission,...meta});
    if(job.kind==="call"){
      await db.doc("calls/"+job.callId).set({eventId:ev.id,caller:m,at:t,recipients:job.recipients,reserved:!!job.reserved,extra:!!job.extra,photoId:ref.id,day:todayStr()});
      if(job.askId)await db.doc("asks/"+job.askId).update({used:true});
      S.sheet=null;toast(`Called. ${job.recipients.filter(x=>!isSnoozed(x)&&!isHome(x)).length} buzzed.`);
    }else if(job.kind==="answer"){dismissed.add(job.call.id);toast(meta.late?"Answered late. Still counts.":"Answered")}
    else toast("Saved");
  }catch(x){toast(writeErr(x))}
  finally{S.busy=false;render()}
});
async function deletePhoto(id){
  S.confirmDelete=null;
  try{await db.doc("photos/"+id).delete();await db.doc("imgs/"+id).delete();imgCache.delete(id);toast("Deleted")}
  catch(x){toast(writeErr(x))}
  render();
}
async function revealNow(ev){S.confirmReveal=false;try{await db.doc("events/"+ev.id).update({revealed:true})}catch(x){toast(writeErr(x))}}

/* live alert for whoever has the page open */
let alertTimer=null;
function renderAlert(){
  const host=$("#alert");const ev=S.view==="event"?curEvent():null,m=ev&&me();
  const c=ev&&m&&isLive(ev)&&!isSnoozed(m)&&!isHome(m)?pendingCallFor(m):null;
  if(!c){host.innerHTML="";host.dataset.id="";clearInterval(alertTimer);alertTimer=null;return}
  if(host.dataset.id!==c.id||!host.innerHTML){
    host.dataset.id=c.id;
    host.innerHTML=`<div class="alert" role="alertdialog" aria-label="Roll Call"><p class="alert-k">roll call</p><p class="alert-t">${esc(c.caller)} called roll</p><p class="alert-c" id="alertC"></p>
      <div class="row"><button class="shutter alert-go" id="alertGo">Shoot</button><button class="ghost alert-no" id="alertNo">Later</button></div></div>`;
    $("#alertGo").onclick=()=>answer(ev,m,c.id);
    $("#alertNo").onclick=()=>{dismissed.add(c.id);render()};
  }
  const tick=()=>{const el=$("#alertC");if(!el)return;const left=c.at+120000-now();el.textContent=left>0?`${Math.floor(left/60000)}:${pad(Math.floor(left%60000/1000))} left`:"Late, still counts"};
  tick();clearInterval(alertTimer);alertTimer=setInterval(tick,1000);
}
setInterval(()=>{if(S.view==="event"&&!S.sheet&&!S.busy&&!S.confirmDelete)render()},30000);

/* event: reveal */
function renderReveal(ev){
  const app=$("#app"),all=P().slice().sort((a,b)=>a.at-b.at),cs=C(),days=evDays(ev);
  loadImgs(all);
  let n=0;
  const tile=(p,tag,late)=>{if(!imgCache.has(p.id))return `<div class="ph" style="aspect-ratio:3/4"></div>`;
    const first=!popped.has(p.id);if(first)popped.add(p.id);
    return `<button class="ph${first?" pop":""}" style="--r:${tilt(p.id,2.6).toFixed(1)}deg${first?`;--d:${Math.min(n++*.07,2).toFixed(2)}s`:""}" data-ph="${p.id}" aria-label="Open ${esc(p.member)}'s shot">${tag?`<span class="tag pill">${esc(tag)}</span>`:""}${late?`<span class="late pill orange">late</span>`:""}<img src="${imgCache.get(p.id)}" alt="${esc(p.member)}: ${esc(p.mission||"")}"></button>`};
  const reasonFor=(x,c)=>{const s=statusOf(x);if((s.snoozeUntil||0)>c.at)return"snoozed";if(s.home&&(s.homeAt||0)<c.at)return`home by ${hhmm(s.homeAt)}`;return"missed it"};
  let body="";
  if(!all.length&&!cs.length){body=`<div class="empty">No shots this time.</div>`}
  else if(S.tab==="moments"){
    const rollSec=cs.length?`<section class="card"><h2>Roll Calls</h2>${cs.map((c,k)=>{const ans=all.filter(p=>p.kind==="roll"&&p.rollId===c.id);
      const missingM=(c.recipients||[]).filter(x=>!ans.some(p=>p.member===x));
      return `<div class="sect moment"><p class="task-sm">#${k+1} · ${esc(c.caller)} · ${hhmm(c.at)}</p>${c.reserved?`<p class="hand ink small">${esc(c.caller)}'s extra</p>`:c.extra?`<p class="hand ink small">backed by the group</p>`:""}
        <div class="board">${ans.sort((a,b)=>(a.member===c.caller?-1:0)-(b.member===c.caller?-1:0)||a.at-b.at).map(p=>tile(p,p.member===c.caller?`${p.member} · called`:p.member,p.late)).join("")}${missingM.map(x=>awayCard(x,reasonFor(x,c))).join("")}</div></div>`}).join("")}</section>`:"";
    const recs=all.filter(p=>p.kind==="recreate");
    const recSec=recs.length?`<section class="card t-blue"><h2>Recreations</h2>${recs.map(p=>{const r=REC[p.recreateId]||{};return `<div class="sect"><p class="task-sm">${esc(r.title||p.mission)}</p><p class="hand ink small">directed by ${esc(p.member)}</p>
      ${r.img?`<div class="twoup"><figure><img class="orig" src="art/${r.img}.jpg" alt="${esc(r.title)}, ${esc(r.source)}"><figcaption class="hand small">original</figcaption></figure><figure>${tile(p)}<figcaption class="hand small">yours</figcaption></figure></div>`
        :`<div class="board">${tile(p)}</div>`}</div>`}).join("")}</section>`:"";
    let chSec="";
    if(ev.type==="trip"){
      chSec=days.map((d,di)=>{
        const dp=all.filter(p=>p.day===d),grp=dp.filter(p=>p.kind==="group"),hp=dp.filter(p=>p.kind==="hunt"),wp=dp.filter(p=>p.kind==="wild");
        if(!grp.length&&!hp.length&&!wp.length)return"";
        const type=huntType(ev,di);let wall="";
        if(type==="letter"||type==="number"){
          const slots=ev.members.map((x,i)=>({h:hunt(ev,di,i),x})).sort((a,b)=>a.h.order-b.h.order);
          wall=`<div class="spell">${slots.map(({h,x})=>{const p=hp.find(q=>q.member===x);return p?tile(p,h.glyph):`<div class="hole" role="img" aria-label="${esc(x)} missed ${esc(h.glyph)}">${esc(h.glyph)}</div>`}).join("")}</div>
            <p class="hand small">${type==="letter"?esc(letterWord(ev)):`1–${ev.members.length}`}</p>`;
        }else if(hp.length)wall=`<div class="board">${hp.sort((a,b)=>(a.order??0)-(b.order??0)).map(p=>tile(p,type==="colour"?p.tag:p.member)).join("")}</div>`;
        const skipped=ev.members.filter(x=>!wp.some(p=>p.member===x));
        return `<section class="card ${["","t-blue","t-lime"][di%3]}"><div class="top"><h2>Day ${di+1}</h2><span class="hand ink">${handDate(d)}</span></div>
          ${grp.length?`<div class="sect"><span class="label">Everyone · ${esc(groupFrame(ev,di))}</span><div class="board">${grp.map(p=>tile(p,p.member)).join("")}</div></div>`:""}
          ${wall?`<div class="sect"><span class="label">${HUNT_DAY[type]}</span>${wall}</div>`:""}
          ${wp.length?`<div class="sect"><span class="label">Wildcards</span><div class="board">${wp.map(p=>tile(p,p.member)).join("")}</div>${skipped.length?`<p class="muted small">Skipped: ${skipped.map(esc).join(", ")}</p>`:""}</div>`:""}</section>`}).join("");
    }else{
      const np=all.filter(p=>p.kind==="night");
      chSec=np.length?`<section class="card t-lime"><h2>Challenges</h2><div class="board">${np.map(p=>tile(p,p.member)).join("")}</div></section>`:"";
    }
    body=rollSec+recSec+chSec;
  }else{
    body=ev.members.map((x,i)=>{const mp=all.filter(p=>p.member===x);
      return `<section class="card ${["","t-blue","t-lime"][i%3]}"><div class="top"><h2>${esc(x)}</h2><span class="hand ink">${mp.length}</span></div>
      ${mp.length?`<div class="board">${mp.map(p=>tile(p,"",p.late)).join("")}</div>`:`<p class="muted">No shots.</p>`}</section>`}).join("");
  }
  const ids=[...new Set(all.map(p=>p.photo).concat(AW().map(a=>a.photo)).filter(Boolean))];
  app.innerHTML=header(ev)+`
  ${ev.sample?`<div class="notice">Sample trip. Real photos, made-up names.<p class="credits">Photos: ${ids.map(id=>`<a href="https://unsplash.com/photos/${id}" target="_blank" rel="noopener">${esc(CREDITS[id]||"Unsplash")}</a>`).join(", ")} (Unsplash). Paintings: public domain, Wikimedia Commons.</p></div>`:""}
  <section class="card counter t-lime">
    <div class="top"><h2>It's <span data-rn="circle" data-rc="--pink" data-rk="rev-${ev.id}" data-pad="5">out</span></h2><span class="big">${all.length}</span></div>
    <p class="muted small">${all.length} shots · ${cs.length} Roll Call${cs.length===1?"":"s"}</p>
  </section>
  <div class="tabs" role="group" aria-label="View"><button class="chip" data-tab="moments" aria-pressed="${S.tab==="moments"}">Moments</button><button class="chip" data-tab="person" aria-pressed="${S.tab==="person"}">People</button></div>
  ${body}`;
  $("#back").onclick=()=>sampleMode()?go("home"):go("group",{groupId:S.groupId});
  app.querySelectorAll("[data-tab]").forEach(b=>b.onclick=()=>{S.tab=b.dataset.tab;render()});
  app.querySelectorAll("[data-ph]").forEach(b=>b.onclick=()=>{const p=all.find(q=>q.id===b.dataset.ph);if(p&&imgCache.has(p.id))lightbox(imgCache.get(p.id),`${p.member}: ${p.mission||""}`)});
}
function lightbox(src,alt,note){
  const ov=$("#overlay");
  ov.innerHTML=`<div class="lightbox" role="dialog" aria-label="${esc(alt)}"><div class="try-out"><img src="${src}" alt="${esc(alt)}">${note?`<p>${esc(note)}</p>`:""}</div><button class="lb-close" id="lbClose">Close</button></div>`;
  const close=()=>{ov.innerHTML=""};$("#lbClose").onclick=close;ov.querySelector(".lightbox").onclick=e=>{if(e.target.classList.contains("lightbox"))close()};
  $("#lbClose").focus();
}
document.addEventListener("keydown",e=>{if(e.key==="Escape")$("#overlay").innerHTML=""});

/* ---------- boot ---------- */
render();
(async()=>{
  const c=window.claude;
  db=c?await c.use("db"):null;
  const user=c?await c.use("user"):null;
  if(user){try{const w=await user.can("data.write");canWrite=w!==false}catch{}}
  if(!db){ready=true;render();return}
  db.collection("groups").onSnapshot(s=>{
    groups=s.docs.map(d=>({id:d.id,...d.data()})).filter(g=>g.name&&Array.isArray(g.members));
    ready=true;render();
  },()=>{ready=true;toast("Couldn't load. Reload the page.");render()});
})();
</script>
